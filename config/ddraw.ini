; Preserve each original display mode aspect ratio in a borderless window.
; GDI avoids the graphics mode transition deadlock observed with D3D9.
[ddraw]
windowed=true
fullscreen=true
border=false
toggle_borderless=true
adjmouse=true
maintas=true
aspect_ratio=
renderer=gdi
savesettings=0
noactivateapp=false
singlecpu=true
maxfps=-1
; Periodic redraws keep menu prompts and movie presentation current.
minfps=5
lock_surfaces=true
