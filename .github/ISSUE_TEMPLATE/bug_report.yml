name: Bug report
description: Report a compatibility or installer problem.
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Patch version, placeholder: v0.1.1}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes:
      label: Windows and display configuration
      description: Windows edition/build, graphics hardware, monitor resolution and scaling.
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps and observed behavior}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Relevant log or error
      description: Paste the relevant portable-runtime.log lines or installer error. Remove personal paths. Do not upload game media, executable dumps or save files.
