name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build 32-bit compatibility helper
        shell: cmd
        run: tools\build-runtime.cmd
      - name: Check focus recovery, window sizing, shortcuts and configuration upgrades
        shell: cmd
        run: tools\test-input.cmd
      - name: Parse installer scripts and compile icon tooling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Add-Type -Path tools\IconResources.cs
          try { [NfsseIconResources]::Embed((New-Object byte[] 256), (New-Object byte[] 6)); throw 'Invalid input accepted' }
          catch [System.Management.Automation.MethodInvocationException] { }
      - name: Check bounded resource decoding and source-derived Japanese prototype edits
        shell: powershell
        run: python -m unittest discover -s tests -p test_nfs_resources.py
      - name: Check Windows installer resource conversion against reference fixtures
        shell: powershell
        run: tests\LanguageResources.Tests.ps1
      - name: Build native language selector and check selection, voices and preservation
        shell: cmd
        run: |
          call tools\build-language-launcher.cmd
          if errorlevel 1 exit /b 1
          call tools\test-languages.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: NFSPortable-x86
          path: |
            build/NFSPortable.dll
            build/NFSSE-Language.exe
